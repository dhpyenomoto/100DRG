<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>翌月のおまかせ ｜ 祥瑞 ガストロノミー会員</title>
<meta name="description" content="祥瑞 各店の翌月のおまかせ 先行案内。大嵓埜（北新地・上七軒）、禅園。">
<meta name="theme-color" content="#14110C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2314110C'/%3E%3Crect x='10' y='10' width='44' height='44' fill='none' stroke='%23B8924A' stroke-width='1.5'/%3E%3Ctext x='32' y='44' font-family='serif' font-size='34' fill='%23D9BC84' text-anchor='middle'%3E百%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Shippori+Mincho+B1:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--sumi:#14110C;--sumi-2:#1C1813;--gold:#B8924A;--gold-l:#D9BC84;--gold-d:#8C6E36;--cream:#ECE4D4;--cream-dim:#A2967F;--line:#06C755;
  --serif-ja:"Shippori Mincho B1",serif;--serif-en:"Cormorant Garamond",serif;--sans-ja:"Zen Kaku Gothic New",sans-serif;}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--sumi);color:var(--cream);font-family:var(--sans-ja);font-weight:300;line-height:1.9;letter-spacing:.02em;-webkit-font-smoothing:antialiased}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(120% 80% at 50% -10%,rgba(184,146,74,.10),transparent 55%)}
.wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:0 26px}
.top{padding:26px 0 6px}
.crumb{font-family:var(--serif-ja);font-size:.8rem;color:var(--gold-l);text-decoration:none;letter-spacing:.04em}
.crumb:hover{color:var(--cream)}
header.page{padding:34px 0 10px;text-align:center}
.kicker{font-family:var(--serif-en);font-size:.7rem;letter-spacing:.36em;text-transform:uppercase;color:var(--gold)}
.month{display:inline-block;margin-top:14px;font-family:var(--serif-en);font-size:.78rem;letter-spacing:.16em;color:var(--gold-l);border:1px solid var(--gold-d);padding:5px 14px}
.brand{font-family:var(--serif-ja);font-weight:700;font-size:2rem;letter-spacing:.06em;margin-top:18px;line-height:1.3}
.store{font-size:.86rem;color:var(--cream-dim);margin-top:6px;letter-spacing:.08em}
.genre{display:inline-block;margin-top:14px;font-family:var(--serif-ja);font-size:.78rem;color:var(--gold-l);border:1px solid var(--gold-d);padding:5px 14px;letter-spacing:.06em}
.photo{aspect-ratio:4/3;background:#0f0d09 center/cover no-repeat;border:1px solid rgba(184,146,74,.28);margin:30px 0 0}
.photo.empty{display:flex;align-items:center;justify-content:center}
.photo.empty::after{content:"準備中";font-family:var(--serif-ja);color:var(--cream-dim);letter-spacing:.24em}
.rule{display:flex;align-items:center;gap:12px;margin:30px 0}
.rule::before,.rule::after{content:"";height:1px;background:linear-gradient(90deg,transparent,var(--gold-d),transparent);flex:1}
.rule .dot{width:5px;height:5px;border:1px solid var(--gold);transform:rotate(45deg)}
.dish{font-family:var(--serif-ja);font-weight:600;font-size:1.5rem;color:var(--cream);letter-spacing:.05em;line-height:1.6;text-align:center}
.desc{font-size:.92rem;color:var(--cream);line-height:2.1;margin-top:20px}
.note{font-size:.78rem;color:var(--cream-dim);margin-top:18px;text-align:center}
.others{margin:46px 0 0;border-top:1px solid rgba(184,146,74,.2);padding-top:26px}
.others h3{font-family:var(--serif-en);font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);text-align:center}
.others .links{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center}
.others a{font-family:var(--serif-ja);font-size:.82rem;color:var(--gold-l);border:1px solid var(--gold-d);padding:8px 14px;text-decoration:none;letter-spacing:.04em}
.others a:hover{background:rgba(184,146,74,.1);border-color:var(--gold)}
.cta{margin:46px 0 0;text-align:center}
.btn-line{display:inline-block;background:var(--line);color:#fff;font-weight:700;font-size:.94rem;padding:15px 34px;text-decoration:none;border-radius:2px;box-shadow:0 8px 30px rgba(6,199,85,.22)}
.back{display:inline-block;margin:30px 0 70px;font-family:var(--serif-ja);font-size:.84rem;color:var(--gold-l);text-decoration:none;border-bottom:1px solid var(--gold-d);padding-bottom:3px}
.back:hover{color:var(--cream)}
.err{text-align:center;color:var(--cream-dim);padding:60px 0}
</style>
</head>
<body>
<div class="wrap top"><a class="crumb" href="index.html">← 祥瑞 ガストロノミー会員</a></div>

<main class="wrap" id="main">
  <p class="err">読み込み中…</p>
</main>

<script src="assets/site-config.js"></script>
<script type="module">
import { loadOmakase, esc, storeById } from './assets/omakase.js';

const params = new URLSearchParams(location.search);
const id = params.get('id');
const main = document.getElementById('main');

function render(s, data){
  document.title = `${s.brand}${s.store?' '+s.store:''} 翌月のおまかせ ｜ 祥瑞 ガストロノミー会員`;
  const photo = (s.image && s.image.trim())
    ? `<div class="photo" style="background-image:url('${esc(s.image)}')"></div>`
    : `<div class="photo empty"></div>`;
  const others = (data.stores||[]).filter(x=>x.id!==s.id).map(x=>
    `<a href="menu.html?id=${encodeURIComponent(x.id)}">${esc(x.brand)} ${esc(x.store)} →</a>`).join('');
  const lineUrl = (window.SITE_CONFIG && window.SITE_CONFIG.lineUrl) || 'index.html#join';
  main.innerHTML = `
    <header class="page">
      <p class="kicker">Next Month's Omakase</p>
      ${s.month?`<div class="month">${esc(s.month)} の一皿</div>`:''}
      <h1 class="brand">${esc(s.brand)||esc(s.store)}</h1>
      ${s.store?`<div class="store">${esc(s.store)}</div>`:''}
      ${s.genre?`<div class="genre">${esc(s.genre)}</div>`:''}
    </header>
    ${photo}
    <div class="rule"><span class="dot"></span></div>
    <div class="dish">${esc(s.dish)||'準備中'}</div>
    ${s.description?`<p class="desc">${esc(s.description)}</p>`:''}
    <p class="note">翌月のおまかせは、会員の皆様へ先行してご案内しています。内容は仕入れにより変更となる場合があります。</p>
    <div class="cta"><a class="btn-line" href="${esc(lineUrl)}">LINEで登録して入会する</a></div>
    ${others?`<div class="others"><h3>他店の翌月のおまかせ</h3><div class="links">${others}</div></div>`:''}
    <div style="text-align:center"><a class="back" href="index.html">← 会員サイトへ戻る</a></div>
  `;
}

loadOmakase().then(data=>{
  const s = id ? storeById(data, id) : (data.stores||[])[0];
  if(!s){ main.innerHTML = '<p class="err">指定の店舗が見つかりませんでした。<br><a class="back" href="index.html">← 会員サイトへ戻る</a></p>'; return; }
  render(s, data);
}).catch(()=>{ main.innerHTML = '<p class="err">ただいま読み込めませんでした。<br><a class="back" href="index.html">← 会員サイトへ戻る</a></p>'; });
</script>
</body>
</html>
