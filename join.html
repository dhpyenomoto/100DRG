<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ご入会・カード登録 ｜ 祥瑞 ガストロノミー会員</title>
<meta name="description" content="祥瑞 ガストロノミー会員のご入会。クレジットカードのご登録で自動継続課金。月額¥50,000（税抜）。">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14110C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2314110C'/%3E%3Crect x='10' y='10' width='44' height='44' fill='none' stroke='%23B8924A' stroke-width='1.5'/%3E%3Ctext x='32' y='44' font-family='serif' font-size='34' fill='%23D9BC84' text-anchor='middle'%3E百%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Shippori+Mincho+B1:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--sumi:#14110C;--sumi-2:#1C1813;--sumi-3:#241F18;--gold:#B8924A;--gold-l:#D9BC84;--gold-d:#8C6E36;--cream:#ECE4D4;--cream-dim:#A2967F;--line:#06C755;
  --serif-ja:"Shippori Mincho B1",serif;--serif-en:"Cormorant Garamond",serif;--sans-ja:"Zen Kaku Gothic New",sans-serif;}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--sumi);color:var(--cream);font-family:var(--sans-ja);font-weight:300;line-height:1.9;letter-spacing:.02em;-webkit-font-smoothing:antialiased}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(120% 80% at 50% -10%,rgba(184,146,74,.10),transparent 55%)}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 26px}
.top{padding:24px 0 6px;text-align:center}
.sitelogo{display:block;width:200px;max-width:62%;height:auto;margin:0 auto 12px;opacity:.95}
header.page{padding:30px 0 8px;text-align:center}
.kicker{font-family:var(--serif-en);font-size:.7rem;letter-spacing:.36em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--serif-ja);font-weight:600;font-size:1.5rem;margin-top:14px;letter-spacing:.04em}
.plan{border:1px solid var(--gold-d);background:var(--sumi-2);padding:30px 24px;margin-top:26px;text-align:center}
.plan .price{font-family:var(--serif-en);font-weight:500;font-size:3rem;line-height:1;color:var(--cream)}
.plan .price .yen{font-size:1.3rem;vertical-align:.5em}
.plan .price .per{font-family:var(--sans-ja);font-size:.86rem;color:var(--cream-dim)}
.plan .tax{font-size:.74rem;color:var(--cream-dim);margin-top:8px}
.terms{margin-top:22px;font-size:.82rem;color:var(--cream-dim);line-height:2}
.terms li{list-style:none;padding-left:16px;position:relative;margin:6px 0}
.terms li::before{content:"";position:absolute;left:0;top:13px;width:5px;height:5px;border:1px solid var(--gold);transform:rotate(45deg)}
.btn{display:block;text-align:center;text-decoration:none;border-radius:2px;font-family:var(--sans-ja);letter-spacing:.06em;cursor:pointer;border:none;width:100%}
.btn-gold{background:var(--gold);color:#1a1610;font-weight:700;font-size:1rem;padding:16px;margin-top:24px}
.btn-gold:hover{filter:brightness(1.07)}
.btn-gold:disabled{opacity:.5;cursor:default}
.btn-ghost{border:1px solid var(--gold-d);color:var(--gold-l);font-size:.86rem;padding:14px;margin-top:12px;font-family:var(--serif-ja);background:transparent}
.login-box{margin-top:24px;border:1px solid rgba(184,146,74,.25);background:var(--sumi-2);border-radius:4px;padding:20px}
.login-box h3{font-family:var(--serif-ja);font-size:1rem;color:var(--gold-l);margin-bottom:12px}
.login-box label{display:block;font-size:.74rem;color:var(--gold-l);margin:10px 0 5px}
.login-box input{width:100%;background:var(--sumi-3);border:1px solid rgba(184,146,74,.3);color:var(--cream);padding:10px 12px;font-size:.95rem;border-radius:3px;font-family:inherit}
.login-box input:focus{outline:none;border-color:var(--gold)}
.msg{font-size:.82rem;margin-top:14px;line-height:1.8;min-height:1em}
.msg.err{color:#e69b76}.msg.ok{color:#9ec48a}
.note{font-size:.74rem;color:var(--cream-dim);margin-top:18px;line-height:1.9}
.back{display:inline-block;margin:28px 0 70px;font-family:var(--serif-ja);font-size:.84rem;color:var(--gold-l);text-decoration:none;border-bottom:1px solid var(--gold-d);padding-bottom:3px}
.who{font-size:.78rem;color:var(--cream-dim);text-align:center;margin-top:10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap top">
  <a href="index.html" aria-label="トップへ"><img class="sitelogo" src="assets/logo.svg" alt="100 DOORS &amp; RESORT &amp; GASTRONOMY" width="200"></a>
</div>

<main class="wrap">
  <header class="page">
    <p class="kicker">Membership</p>
    <h1>ご入会・カード登録</h1>
  </header>

  <div class="plan">
    <div class="price"><span class="yen">¥</span>50,000<span class="per"> ／ 月</span></div>
    <div class="tax">税抜（税込 ¥55,000）　｜　毎月 4 ポイント付与</div>
    <ul class="terms">
      <li>クレジットカードのご登録で、自動継続課金となります。</li>
      <li>翌月分の会費を、毎月「前月末日」に課金します。</li>
      <li>解約は解約希望月の2ヶ月以上前にお申し出ください。</li>
    </ul>
  </div>

  <!-- ログイン（Firebase連携時のみ表示） -->
  <div class="login-box" id="loginBox" hidden>
    <h3>会員アカウント</h3>
    <p style="font-size:.8rem;color:var(--cream-dim)">ご入会には、会員アカウントでのログインが必要です。はじめての方は仮パスワードでアカウントを作成します。</p>
    <label>メールアドレス</label>
    <input type="email" id="email" autocomplete="email">
    <label>パスワード</label>
    <input type="password" id="pass" autocomplete="current-password">
    <button class="btn btn-ghost" id="btnAuth" style="margin-top:14px">ログイン / 新規登録</button>
    <div class="who" id="who"></div>
  </div>

  <button class="btn btn-gold" id="btnJoin">カードを登録して入会する</button>
  <a class="btn btn-ghost" id="btnLine" href="index.html#join">LINEで相談する</a>

  <div class="msg" id="msg"></div>
  <p class="note" id="note"></p>

  <div style="text-align:center"><a class="back" href="index.html">← 会員サイトへ戻る</a></div>
</main>

<script src="assets/site-config.js"></script>
<script type="module">
const cfg = window.SITE_CONFIG || {};
const stripe = cfg.stripe || {};
const fbCfg = cfg.firebase || null;
const $ = id => document.getElementById(id);
const setMsg = (t,k)=>{const m=$('msg');m.className='msg'+(k?' '+k:'');m.textContent=t||''};

if (cfg.lineUrl) $('btnLine').href = cfg.lineUrl;

let FB=null, user=null, idToken=null;

async function initFirebase(){
  const [appM, authM] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js`)
  ]);
  const app = appM.initializeApp(fbCfg);
  FB = { auth: authM.getAuth(app), m: authM };
  $('loginBox').hidden = false;
  FB.m.onAuthStateChanged(FB.auth, async u=>{
    user = u;
    if(u){ idToken = await u.getIdToken(); $('who').textContent = 'ログイン中：'+(u.email||''); }
    else { idToken=null; $('who').textContent=''; }
  });
}

$('btnAuth') && $('btnAuth').addEventListener('click', async ()=>{
  if(!FB) return;
  const email=$('email').value.trim(), pass=$('pass').value;
  setMsg('');
  try{ await FB.m.signInWithEmailAndPassword(FB.auth,email,pass); setMsg('ログインしました。','ok'); }
  catch(e){
    if(e && (e.code==='auth/user-not-found' || e.code==='auth/invalid-credential')){
      try{ await FB.m.createUserWithEmailAndPassword(FB.auth,email,pass); setMsg('アカウントを作成しました。','ok'); }
      catch(e2){ setMsg('登録できませんでした：'+(e2.code||e2.message),'err'); }
    } else { setMsg('ログインできませんでした：'+(e.code||e.message),'err'); }
  }
});

// 入会ボタンの挙動は設定により分岐
async function join(){
  setMsg('');
  // 方式A: Payment Link（ノーコード）
  if (stripe.paymentLink){ location.href = stripe.paymentLink; return; }
  // 方式B: Cloud Functions 経由の Checkout（ログイン必須）
  if (stripe.checkoutFunctionUrl){
    if (fbCfg && !user){ setMsg('先に会員アカウントでログインしてください。','err'); return; }
    $('btnJoin').disabled = true; setMsg('決済ページへ移動します…');
    try{
      const res = await fetch(stripe.checkoutFunctionUrl, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ idToken })
      });
      const data = await res.json();
      if (data.url){ location.href = data.url; return; }
      throw new Error(data.error || 'no url');
    }catch(e){ setMsg('決済ページを開けませんでした。時間をおいて再度お試しください。','err'); $('btnJoin').disabled=false; }
    return;
  }
  // 未設定（準備中）
  setMsg('ただいまオンライン入会の準備中です。公式LINEよりお問い合わせください。','err');
  $('btnLine').scrollIntoView({behavior:'smooth'});
}
$('btnJoin').addEventListener('click', join);

// 起動
if (fbCfg) initFirebase().catch(e=>{ console.warn(e); });
if (!stripe.paymentLink && !stripe.checkoutFunctionUrl){
  $('note').textContent = '※ 決済設定（Stripe）が未設定のため、現在はLINEでのご案内となります。設定後はこのページから直接ご入会いただけます。';
}
</script>
</body>
</html>
